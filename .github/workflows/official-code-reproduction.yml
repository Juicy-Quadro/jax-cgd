name: Official-code CPINN reproduction
on:
  push:
    branches: [experiments/official-code-reproduction]
    paths: [.github/workflows/official-code-reproduction.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [poisson-long, burgers-paired]
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated CPU reference environment
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[examples,test]' 'jax[cpu]==0.10.2' 'flax==0.12.8' 'CGDs==0.4.5' 'pyDOE==0.3.8'
          python -m pip check
          mkdir -p results vendor
          git clone https://github.com/comp-physics/CPINN.git vendor/CPINN
          git -C vendor/CPINN checkout ef0d6a4504e5a5fd69e3d0583f4c821b33436c2d
          git diff df67eb6c6309014b6c2752cfadd59a7483c181b2 -- jax_cgd examples > results/package-diff.txt
          test ! -s results/package-diff.txt
          python -m pip freeze > results/freeze.txt
          git rev-parse HEAD > results/head.txt
          sha256sum vendor/CPINN/Burger/burgers_shock.mat > results/reference-sha256.txt
      - name: Historical solver and physical derivative regression checks
        run: python -m pytest -q experiments/test_official_run.py tests/test_cpinn_flax.py tests/test_mlp_jets.py
      - name: Full-data bounded experiment (not full-run success by timeout)
        shell: bash
        run: |
          case '${{ matrix.case }}' in
            poisson-long) ARGS='--problem poisson --steps 34001 --paired-prefix 20 --report-every 100' ;;
            burgers-paired) ARGS='--problem burgers --steps 100 --paired-prefix 0 --report-every 10' ;;
          esac
          timeout --signal=INT --kill-after=30 1300 python -m experiments.official_run $ARGS --seconds 1000 --output results/${{ matrix.case }} 2>&1 | tee results/training.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-code-${{ matrix.case }}
          path: results/
          if-no-files-found: error
