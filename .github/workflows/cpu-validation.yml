name: CPU optimization acceptance
on:
  pull_request:
    paths: ["jax_cgd/**", "examples/**", "tests/**", "benchmarks/**", ".github/workflows/cpu-validation.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    env:
      JAX_ENABLE_X64: "1"
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e . -r requirements-examples.txt 'jax[cpu]==0.10.2' 'flax==0.12.8'
      - run: python -m pytest -q
      - run: python -m examples.cpinn_counted --problem poisson --smoke --formulation block --solver gmres --generic
      - run: python -m examples.cpinn_counted --problem burgers --smoke
  benchmark:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        replication: [1, 2]
        case: [poisson-small, poisson-50, burgers-small, poisson-large]
    env:
      JAX_ENABLE_X64: "1"
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-examples.txt 'jax[cpu]==0.10.2' 'flax==0.12.8'
      - name: Immutable old-source checkouts
        run: |
          mkdir -p /tmp/legacy /tmp/counted
          git archive b9320efa1d5ef66e88a2a87f215482671ccfcf82 jax_cgd | tar -x -C /tmp/legacy
          git archive 78d2f7c275ad155cc206f3b0261763e08f4a43bb jax_cgd | tar -x -C /tmp/counted
      - name: Randomized synchronized equal-accuracy benchmark
        shell: bash
        run: |
          case "${{ matrix.case }}" in
            poisson-small) ARGS="--problem poisson --n-pde 128 --n-bc 16 --width 16 --layers 2 --steps 10" ;;
            poisson-50) ARGS="--problem poisson --n-pde 256 --n-bc 16 --width 50 --layers 3 --steps 5" ;;
            burgers-small) ARGS="--problem burgers --n-pde 32 --n-bc 16 --width 16 --layers 2 --steps 10" ;;
            poisson-large) ARGS="--problem poisson --n-pde 2048 --n-bc 50 --width 50 --layers 3 --steps 5" ;;
          esac
          python -m benchmarks.cpu_optimizer --legacy /tmp/legacy --counted /tmp/counted $ARGS --repeats 11 --output results/${{ matrix.case }}-${{ matrix.replication }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-${{ matrix.case }}-${{ matrix.replication }}
          path: results/*.json
