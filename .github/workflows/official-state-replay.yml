name: Official-state solver drift diagnostic
on:
  push:
    branches: [experiments/official-code-reproduction]
    paths: [.github/workflows/official-state-replay.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Frozen package and reference
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[examples,test]' 'jax[cpu]==0.10.2' 'flax==0.12.8' 'CGDs==0.4.5' 'pyDOE==0.3.8'
          python -m pip check
          mkdir -p results vendor
          git clone https://github.com/comp-physics/CPINN.git vendor/CPINN
          git -C vendor/CPINN checkout ef0d6a4504e5a5fd69e3d0583f4c821b33436c2d
          git diff df67eb6c6309014b6c2752cfadd59a7483c181b2 -- jax_cgd examples > results/package-diff.txt
          test ! -s results/package-diff.txt
          python -m pip freeze > results/freeze.txt
          git rev-parse HEAD > results/head.txt
      - uses: actions/download-artifact@v4
        with:
          name: official-code-poisson-paired
          run-id: 41286730023
          github-token: ${{ github.token }}
          path: prior
      - name: Same-state residual and derivative comparison
        run: python -m experiments.replay_official_state --snapshot prior/poisson-paired/last_state.npz --fixture prior/poisson-paired/fixture.npz --output results/diagnostics 2>&1 | tee results/replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-code-state-diagnostic
          path: results/
          if-no-files-found: error
