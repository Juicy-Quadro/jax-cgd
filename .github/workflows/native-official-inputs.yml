name: Native solvers with official CPINN inputs
on:
  push:
    branches: [experiments/official-code-reproduction]
    paths: [.github/workflows/native-official-inputs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and verify released numerical sources
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[examples,test]' 'jax[cpu]==0.10.2' 'flax==0.12.8' 'CGDs==0.4.5' 'pyDOE==0.3.8'
          python -m pip check
          mkdir -p results vendor
          git clone https://github.com/comp-physics/CPINN.git vendor/CPINN
          git -C vendor/CPINN checkout ef0d6a4504e5a5fd69e3d0583f4c821b33436c2d
          git diff df67eb6c6309014b6c2752cfadd59a7483c181b2 -- jax_cgd examples > results/package-diff.txt
          test ! -s results/package-diff.txt
          python -m pip freeze > results/freeze.txt
          git rev-parse HEAD > results/head.txt
      - name: Full released-source regression suite
        run: python -m pytest -q tests
      - name: Native CG and GMRES on same full-data Poisson fixture
        shell: bash
        run: |
          timeout --signal=INT --kill-after=30 1200 python -m experiments.native_official_inputs --steps 200 --output results/native-poisson 2>&1 | tee results/training.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-code-native-solvers
          path: results/
          if-no-files-found: error
