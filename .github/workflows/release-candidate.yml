name: Release candidate validation
on:
  push:
    branches: [release/stability-rc]
  pull_request:
    paths:
      - 'jax_cgd/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - 'MANIFEST.in'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install build 'twine>=6'
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Confirm sdist can build a wheel without repository files
        run: |
          mkdir -p "$RUNNER_TEMP/sdist-build"
          tar -xf dist/*.tar.gz -C "$RUNNER_TEMP/sdist-build"
          python -m build --wheel "$RUNNER_TEMP/sdist-build/jax_cgd-2.0.0rc1" --outdir "$RUNNER_TEMP/rebuilt"
      - uses: actions/upload-artifact@v4
        with:
          name: rc-distributions
          path: dist/*
  installed-wheel:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: '3.11'
            label: minimum-jax
            pins: 'jax[cpu]==0.9.0 flax==0.12.0 optax==0.2.5'
          - python: '3.12'
            label: reference
            pins: 'jax[cpu]==0.10.2 flax==0.12.8'
          - python: '3.13'
            label: newest-in-range
            pins: 'jax[cpu]>=0.9.0,<0.13'
    env:
      JAX_ENABLE_X64: '1'
      JAX_PLATFORMS: cpu
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: rc-distributions
          path: dist
      - name: Install wheel, not editable source
        env:
          RC_PINS: ${{ matrix.pins }}
        run: |
          python - <<'PY'
          import glob, os, shlex, subprocess, sys
          wheel = glob.glob('dist/*.whl')[0]
          subprocess.check_call([sys.executable, '-m', 'pip', 'install', wheel+'[examples,test]', *shlex.split(os.environ['RC_PINS'])])
          PY
          python -m pip check
          python -m pip freeze > environment-${{ matrix.label }}.txt
      - name: Run installed tests outside checkout
        run: |
          mkdir -p "$RUNNER_TEMP/installed-tests"
          cp -r tests examples pyproject.toml "$RUNNER_TEMP/installed-tests/"
          cd "$RUNNER_TEMP/installed-tests"
          python - <<'PY'
          import importlib.metadata, pathlib, jax, jax_cgd
          root = pathlib.Path.cwd()
          origin = pathlib.Path(jax_cgd.__file__).resolve()
          assert not origin.is_relative_to(root)
          assert 'site-packages' in str(origin), origin
          assert importlib.metadata.version('jax-cgd') == jax_cgd.__version__ == '2.0.0rc1'
          print('INSTALLED_WHEEL', origin, 'JAX', jax.__version__, 'DEVICES', jax.devices())
          PY
          python -m pytest -q
          python -m examples.cpinn_counted --problem poisson --smoke
          python -m examples.cpinn_counted --problem burgers --smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: environment-${{ matrix.label }}
          path: environment-*.txt
