name: CPU profiling workspace
on:
  push:
    branches: ["perf/cpu-bottlenecks"]
    paths: [".github/workflows/cpu-workspace.yml"]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Snapshot immutable sources and portable Flax wheels
        run: |
          mkdir -p workspace/current workspace/baseline workspace/wheels
          git archive 78d2f7c275ad155cc206f3b0261763e08f4a43bb | tar -x -C workspace/current
          git archive b9320efa1d5ef66e88a2a87f215482671ccfcf82 | tar -x -C workspace/baseline
          python -m pip download --only-binary=:all: --dest workspace/wheels 'flax==0.12.0' 'optax==0.2.5' 'orbax-checkpoint==0.11.32'
          rm -f workspace/wheels/jax-* workspace/wheels/jaxlib-* workspace/wheels/numpy-* workspace/wheels/scipy-* workspace/wheels/ml_dtypes-*
          lscpu > workspace/runner_cpu.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cpu-profiling-workspace
          path: workspace/
          retention-days: 7
