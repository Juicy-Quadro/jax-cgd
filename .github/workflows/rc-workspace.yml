name: RC workspace snapshot
on:
  push:
    branches: [release/stability-rc]
    paths: [.github/workflows/rc-workspace.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive immutable main source and build-tool wheels
        run: |
          mkdir -p snapshot/wheels
          git archive b3271dd2b0333843077dcfd5c9d4f5a0ae945be8 > snapshot/source.tar
          python -m pip download --only-binary=:all: --dest snapshot/wheels build 'setuptools>=77' wheel
      - uses: actions/upload-artifact@v4
        with:
          name: rc-workspace
          path: snapshot/
          retention-days: 7
