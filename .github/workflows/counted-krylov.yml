name: Counted Krylov and Flax performance
on:
  push:
    branches: ["perf/counted-krylov-cpinn"]
  pull_request:
    paths:
      - "jax_cgd/**"
      - "tests/**"
      - "examples/cpinn_counted.py"
      - "benchmarks/**"
      - ".github/workflows/counted-krylov.yml"
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      JAX_ENABLE_X64: "1"
      OMP_NUM_THREADS: "2"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-examples.txt
      - name: Complete test suite (including Flax)
        run: python -m pytest -q
      - name: Counted full-block GMRES Flax smoke
        run: python -m examples.cpinn_counted --problem poisson --smoke --formulation block --solver gmres --generic
      - name: Counted Burgers Flax smoke
        run: python -m examples.cpinn_counted --problem burgers --smoke
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [poisson-small, poisson-50, burgers-small]
    env:
      JAX_ENABLE_X64: "1"
      OMP_NUM_THREADS: "2"
      XLA_PYTHON_CLIENT_PREALLOCATE: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e . -r requirements-examples.txt
      - name: Prepare immutable pre-change source
        run: |
          mkdir -p /tmp/cgd-baseline
          git archive b9320efa1d5ef66e88a2a87f215482671ccfcf82 jax_cgd | tar -x -C /tmp/cgd-baseline
      - name: Equal-accuracy Flax optimizer benchmark
        shell: bash
        run: |
          case "${{ matrix.case }}" in
            poisson-small) ARGS="--problem poisson --n-pde 128 --n-bc 16 --width 16 --layers 2 --steps 10" ;;
            poisson-50) ARGS="--problem poisson --n-pde 256 --n-bc 16 --width 50 --layers 3 --steps 5" ;;
            burgers-small) ARGS="--problem burgers --n-pde 32 --n-bc 16 --width 16 --layers 2 --steps 10" ;;
          esac
          python -m benchmarks.cpinn_optimizer --baseline /tmp/cgd-baseline $ARGS --repeats 9 --tol 1e-8 --output results/${{ matrix.case }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: counted-krylov-${{ matrix.case }}
          path: results/*.json
