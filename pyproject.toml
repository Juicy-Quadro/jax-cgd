[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-cgd"
dynamic = ["version"]
description = "Matrix-free competitive gradient descent for real zero-sum games in JAX"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Yiming Lu", email = "luyiming925@gmail.com"}]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["jax>=0.9.0,<0.13", "numpy>=2.0,<3", "scipy>=1.13,<2"]

[project.optional-dependencies]
examples = ["flax>=0.12.0,<0.13", "optax>=0.2.5,<0.3"]
test = ["pytest>=8,<10"]
dev = ["pytest>=8,<10", "build>=1.2", "twine>=6"]

[project.urls]
Repository = "https://github.com/Juicy-Quadro/jax-cgd"
Issues = "https://github.com/Juicy-Quadro/jax-cgd/issues"

[tool.setuptools.packages.find]
include = ["jax_cgd", "jax_cgd.*"]

[tool.setuptools.dynamic]
version = {attr = "jax_cgd._version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
